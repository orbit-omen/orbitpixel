[package]
name = "orbitpixel"
version = "0.1.0"
edition = "2021"
description = "Terminal-native web browser written in Rust"
license = "MIT"
repository = "https://github.com/orbit-omen/orbitpixel"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5"
